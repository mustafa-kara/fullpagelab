<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DPR ve Yakınlaştırma Kalibrasyonu</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 1200px; }
      html { scrollbar-color: #ff00ff #e2e8f0; }
      ::-webkit-scrollbar { width: 16px; }
      ::-webkit-scrollbar-track { background: #e2e8f0; }
      ::-webkit-scrollbar-thumb { background: #ff00ff; }
      body { color: #172033; font: 700 24px/1 Arial, sans-serif; }
      .band[data-band-index] {
        position: relative;
        display: grid;
        width: 100%;
        height: 200px;
        place-items: center;
        overflow: hidden;
        color: #111827;
      }
      .band[data-band-index]::before {
        position: absolute;
        inset: 0;
        content: "";
        background-image:
          linear-gradient(90deg, rgba(17, 24, 39, .25) 1px, transparent 1px),
          linear-gradient(rgba(17, 24, 39, .25) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      .band[data-band-index] span { z-index: 1; padding: 16px 24px; border: 4px solid #172033; background: #ffffff; }
      .band[data-band-index="0"] { background: #ef4444; }
      .band[data-band-index="1"] { background: #f97316; }
      .band[data-band-index="2"] { background: #eab308; }
      .band[data-band-index="3"] { background: #22c55e; }
      .band[data-band-index="4"] { background: #06b6d4; }
      .band[data-band-index="5"] { background: #3b82f6; }
    </style>
  </head>
  <body>
    <div class="band" data-band-index="0"><span>Bant 0 · 20 CSS px ızgara</span></div>
    <div class="band" data-band-index="1"><span>Bant 1 · 20 CSS px ızgara</span></div>
    <div class="band" data-band-index="2"><span>Bant 2 · 20 CSS px ızgara</span></div>
    <div class="band" data-band-index="3"><span>Bant 3 · 20 CSS px ızgara</span></div>
    <div class="band" data-band-index="4"><span>Bant 4 · 20 CSS px ızgara</span></div>
    <div class="band" data-band-index="5"><span>Bant 5 · 20 CSS px ızgara</span></div>
  </body>
</html>
