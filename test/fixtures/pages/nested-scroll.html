<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>İç İçe Kaydırma Paneli</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      html, .panel { scrollbar-color: #ff00ff #e2e8f0; }
      ::-webkit-scrollbar { width: 16px; }
      ::-webkit-scrollbar-track { background: #e2e8f0; }
      ::-webkit-scrollbar-thumb { background: #ff00ff; }
      body { padding: 80px 0 0 80px; background: #e2e8f0; color: #172033; font: 700 24px/1 Arial, sans-serif; }
      h1 { width: 720px; margin: 0 0 32px; font-size: 32px; }
      .panel {
        width: calc(100vw - 80px);
        height: 420px;
        overflow-y: scroll;
        border: 8px solid #172033;
        border-right: 0;
        background: #ffffff;
      }
      .content { width: 100%; height: 1680px; }
      .band[data-band-index] { display: grid; width: 100%; height: 200px; padding: 12px; place-items: start; color: #111827; }
      .band[data-band-index="0"] { background: #ef4444; }
      .band[data-band-index="1"] { background: #f97316; }
      .band[data-band-index="2"] { background: #eab308; }
      .band[data-band-index="3"] { background: #22c55e; }
      .band[data-band-index="4"] { background: #06b6d4; }
      .band[data-band-index="5"] { background: #3b82f6; }
      .band[data-band-index="6"] { background: #8b5cf6; }
      .band[data-band-index="7"] { background: #ec4899; }
      .remainder { display: grid; height: 80px; place-items: center; background: #14b8a6; font-size: 18px; }
    </style>
  </head>
  <body>
    <h1>420 px kaydırılabilir panel</h1>
    <section class="panel" aria-label="İç kaydırma paneli">
      <div class="content">
        <div class="band" data-band-index="0">Bant 0</div>
        <div class="band" data-band-index="1">Bant 1</div>
        <div class="band" data-band-index="2">Bant 2</div>
        <div class="band" data-band-index="3">Bant 3</div>
        <div class="band" data-band-index="4">Bant 4</div>
        <div class="band" data-band-index="5">Bant 5</div>
        <div class="band" data-band-index="6">Bant 6</div>
        <div class="band" data-band-index="7">Bant 7</div>
        <div class="remainder">1680 px içerik sonu</div>
      </div>
    </section>
  </body>
</html>
