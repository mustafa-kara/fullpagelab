<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tek Seferlik Dinamik Yükseklik</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; min-height: 1200px; }
      html { scrollbar-color: #ff00ff #e2e8f0; }
      ::-webkit-scrollbar { width: 16px; }
      ::-webkit-scrollbar-track { background: #e2e8f0; }
      ::-webkit-scrollbar-thumb { background: #ff00ff; }
      body { color: #172033; font: 700 24px/1 Arial, sans-serif; }
      .band[data-band-index] { display: grid; width: 100%; height: 200px; padding: 12px; place-items: start; color: #111827; }
      .band[data-band-index="0"] { background: #ef4444; }
      .band[data-band-index="1"] { background: #f97316; }
      .band[data-band-index="2"] { background: #eab308; }
      .band[data-band-index="3"] { background: #22c55e; }
      .band[data-band-index="4"] { background: #06b6d4; }
      .band[data-band-index="5"] { background: #3b82f6; }
      .dynamic-section { width: 100%; height: 400px; padding: 12px; background: #8b5cf6; }
    </style>
  </head>
  <body>
    <div class="band" data-band-index="0">Bant 0</div>
    <div class="band" data-band-index="1">Bant 1</div>
    <div class="band" data-band-index="2">Bant 2</div>
    <div class="band" data-band-index="3">Bant 3</div>
    <div class="band" data-band-index="4">Bant 4</div>
    <div class="band" data-band-index="5">Bant 5</div>
    <script>
      window.addEventListener('scroll', () => {
        const section = document.createElement('section');
        section.className = 'dynamic-section';
        section.dataset.dynamicSection = 'true';
        section.textContent = 'İlk kaydırmada eklenen 400 px dinamik bölüm';
        document.body.append(section);
      }, { once: true });
    </script>
  </body>
</html>
